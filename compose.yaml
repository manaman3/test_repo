services:
  bot:
    build: .
    env_file:
      - .env
    restart: unless-stopped
    expose:
      - "8080"          # порт виден только внутри docker-сети
    # ports: не нужен — наружу торчит только nginx

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "443:443"       # только nginx смотрит наружу
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/hackatonmax2026.hopto.org/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/hackatonmax2026.hopto.org/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      - bot